# 모일 곳 — 정적 사이트. 빌드 단계 없음(수집은 GitHub Actions가 하고 결과를 커밋한다).
[build]
  publish = "site"

# 데이터는 매일 새벽 갱신되므로 캐시에 묶이면 안 된다.
# 화면(index.html)도 함께 배포되므로 같은 규칙을 적용한다.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
